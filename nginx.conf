server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip text assets
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # hashed build assets are immutable → cache hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 3D / GLB models
  location /models/ {
    expires 7d;
    try_files $uri =404;
  }

  # SPA fallback (single page; no server routes)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # never cache the entry document (so new deploys are picked up)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
